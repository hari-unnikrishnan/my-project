<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Aether AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./theme.css">
</head>
<body class="theme-dark">
  <main class="auth-shell">
    <a class="brand auth-brand" href="./index.html"><span class="brand-mark">A</span><span class="brand-copy"><strong>Aether AI</strong><small>workspace</small></span></a>
    <section class="auth-card glass-panel">
      <span class="eyebrow">Start creating</span>
      <h1>Your ideas deserve a better workspace.</h1>
      <p class="auth-intro">Create an account to bring your AI workflows together.</p>
      <form data-preview-form>
        <label class="form-label" for="name">Full name</label>
        <input class="form-control" id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required>
        <label class="form-label" for="email">Work email</label>
        <input class="form-control" id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required>
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
        <label class="form-label" for="password-confirmation">Confirm password</label>
        <input class="form-control" id="password-confirmation" name="password_confirmation" type="password" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
        <button class="primary-button auth-submit" type="submit">Create account <i class="bi bi-arrow-right"></i></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="./login.html">Sign in</a></p>
    </section>
    <footer class="auth-footer">By continuing, you agree to our terms and privacy policy.</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
