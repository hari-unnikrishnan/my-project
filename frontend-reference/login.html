<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Aether AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./theme.css">
</head>
<body class="theme-dark">
  <main class="auth-shell">
    <a class="brand auth-brand" href="./index.html"><span class="brand-mark">A</span><span class="brand-copy"><strong>Aether AI</strong><small>workspace</small></span></a>
    <section class="auth-card glass-panel">
      <span class="eyebrow">Welcome back</span>
      <h1>Sign in to your workspace</h1>
      <p class="auth-intro">Pick up where your best ideas left off.</p>
      <form data-preview-form>
        <label class="form-label" for="email">Email address</label>
        <input class="form-control" id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required>
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <div class="auth-options"><label><input type="checkbox" name="remember"> Remember me</label><a href="./forgot-password.html">Forgot password?</a></div>
        <button class="primary-button auth-submit" type="submit">Sign in <i class="bi bi-arrow-right"></i></button>
      </form>
      <p class="auth-switch">New to Aether AI? <a href="./register.html">Create an account</a></p>
    </section>
    <footer class="auth-footer">Secure workspace access · <a href="./index.html">Back to home</a></footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
