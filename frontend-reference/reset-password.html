<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — Aether AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./theme.css">
</head>
<body class="theme-dark">
  <main class="auth-shell">
    <a class="brand auth-brand" href="./index.html"><span class="brand-mark">A</span><span class="brand-copy"><strong>Aether AI</strong><small>workspace</small></span></a>
    <section class="auth-card glass-panel">
      <span class="eyebrow">Account recovery</span>
      <h1>Choose a new password</h1>
      <p class="auth-intro">Create a strong password to secure your Aether AI account.</p>
      <form data-preview-form>
        <label class="form-label" for="email">Email address</label>
        <input class="form-control" id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required>
        <label class="form-label" for="password">New password</label>
        <input class="form-control" id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
        <label class="form-label" for="password-confirmation">Confirm new password</label>
        <input class="form-control" id="password-confirmation" name="password_confirmation" type="password" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
        <button class="primary-button auth-submit" type="submit">Update password <i class="bi bi-arrow-right"></i></button>
      </form>
      <p class="auth-switch"><a href="./login.html"><i class="bi bi-arrow-left"></i> Return to sign in</a></p>
    </section>
    <footer class="auth-footer">Secure workspace access · Aether AI</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
